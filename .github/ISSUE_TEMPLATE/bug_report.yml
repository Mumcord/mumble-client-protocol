name: Bug report
description: Something in mumble-client-protocol doesn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally a few lines of code, or the example you ran.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mumble-client-protocol version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Mumble server version
      placeholder: "mumble-server 1.5.735"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Build output or logs
      description: Remove anything private first (server addresses, user names, passwords, chat contents).
      render: text
