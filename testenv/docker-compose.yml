# Local Mumble test servers for the live tests. Start with ./up.sh, never with a plain
# "docker compose up": up.sh creates the throwaway password and certificate and seeds channels.
x-mumble: &mumble
  restart: "no"
  # The default bridge: the servers need no network of their own, and hosts that run many compose
  # projects can run out of address pools for new ones.
  network_mode: bridge
  environment: &mumble-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    MUMBLE_SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?run ./up.sh, it creates .env}
    MUMBLE_ACCEPT_UNKNOWN_SETTINGS: "true"
    MUMBLE_CONFIG_SERVERPASSWORD: ${SERVER_PASSWORD:-}
    MUMBLE_CONFIG_SSLCERT: /certs/cert.pem
    MUMBLE_CONFIG_SSLKEY: /certs/key.pem
    MUMBLE_CONFIG_REGISTERNAME: mumble-client-protocol test server
    MUMBLE_CONFIG_BANDWIDTH: "72000"
    MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"   # tests reconnect often; never ban them

services:
  v15:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    ports: ["${PORT_V15:-64738}:64738/tcp", "${PORT_V15:-64738}:64738/udp"]
    volumes: ["./${DATA_ROOT}/v15:/data", "./certs:/certs:ro"]
  v14:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.4.230
    # This image has no PUID/PGID support and runs as a fixed uid 1000, which cannot write to a
    # data dir owned by another host user (e.g. uid 1001 on CI runners).
    user: "${PUID:-1000}:${PGID:-1000}"
    ports: ["${PORT_V14:-64739}:64738/tcp", "${PORT_V14:-64739}:64738/udp"]
    volumes: ["./${DATA_ROOT}/v14:/data", "./certs:/certs:ro"]
  # There is no official 1.3 image; this one installs Debian bullseye's mumble-server package.
  v13:
    build: ./v13
    image: mcp-testenv-v13
    restart: "no"
    network_mode: bridge
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?run ./up.sh, it creates .env}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
    ports: ["${PORT_V13:-64740}:64738/tcp", "${PORT_V13:-64740}:64738/udp"]
    volumes: ["./${DATA_ROOT}/v13:/data", "./certs:/certs:ro"]
  # Listener limits of 0 disable channel listening, so Listen must be refused.
  limit:
    <<: *mumble
    image: mumblevoip/mumble-server:v1.5.735
    environment:
      <<: *mumble-env
      MUMBLE_CONFIG_LISTENERSPERCHANNEL: "0"
      MUMBLE_CONFIG_LISTENERSPERUSER: "0"
    ports: ["${PORT_LIMIT:-64741}:64738/tcp", "${PORT_LIMIT:-64741}:64738/udp"]
    volumes: ["./${DATA_ROOT}/limit:/data", "./certs:/certs:ro"]
